<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quake 3 FPS - HTML5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        .hud-stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            line-height: 1.8;
        }

        .weapon-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 16px;
            text-align: right;
        }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid #0f0;
            pointer-events: none;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #0f0;
        }

        .crosshair::before {
            width: 2px;
            height: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .crosshair::after {
            height: 2px;
            width: 8px;
            top: 50%;
            transform: translateY(-50%);
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0;
            font-size: 20px;
            z-index: 1000;
        }

        #loadingScreen.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="crosshair"></div>
        <div class="hud-stats">
            <div>Health: <span id="health">100</span></div>
            <div>Armor: <span id="armor">0</span></div>
            <div>Ammo: <span id="ammo">0</span></div>
            <div>FPS: <span id="fps">0</span></div>
        </div>
        <div class="weapon-display">
            <div id="currentWeapon">Machinegun</div>
            <div id="weaponStats">Ammo in mag: 0 / 0</div>
        </div>
    </div>

    <div id="loadingScreen">
        Initializing Engine...
    </div>

    <!-- Engine Core -->
    <script src="js/core/engine.js"></script>
    <script src="js/core/input.js"></script>
    <script src="js/core/renderer.js"></script>
    <script src="js/core/physics.js"></script>

    <!-- Player Systems -->
    <script src="js/player/player.js"></script>
    <script src="js/player/movement.js"></script>
    <script src="js/player/slide_movement.js"></script>
    <script src="js/player/camera.js"></script>

    <!-- Weaponry Systems -->
    <script src="js/weaponry/weaponry.js"></script>
    <script src="js/weaponry/weapons.js"></script>

    <!-- World -->
    <script src="js/world/world.js"></script>
    <script src="js/world/map.js"></script>

    <!-- Entities -->
    <script src="js/entities/entity.js"></script>
    <script src="js/entities/enemy.js"></script>

    <!-- Game Loop -->
    <script src="js/game.js"></script>
</body>
</html>
