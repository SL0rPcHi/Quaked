<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quake 3 FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 40px;
            font-family: 'Courier New', monospace;
            font-size: 48px;
            font-weight: bold;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
        }

        .hud-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hud-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .hud-value {
            font-size: 48px;
        }

        #ammoLeft {
            text-align: left;
        }

        #healthCenter {
            text-align: center;
        }

        #armorRight {
            text-align: right;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-element" id="ammoLeft">
            <div class="hud-label">Ammo</div>
            <div class="hud-value" id="ammoValue">0</div>
        </div>
        <div class="hud-element" id="healthCenter">
            <div class="hud-label">Health</div>
            <div class="hud-value" id="healthValue">100</div>
        </div>
        <div class="hud-element" id="armorRight">
            <div class="hud-label">Armor</div>
            <div class="hud-value" id="armorValue">0</div>
        </div>
    </div>

    <!-- Cannon-es for physics -->
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <!-- Three.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Engine Core -->
    <script src="js/core/engine.js"></script>
    <script src="js/core/input.js"></script>

    <!-- Player Systems -->
    <script src="js/player/player.js"></script>
    <script src="js/player/movement.js"></script>
    <script src="js/player/slide_movement.js"></script>
    <script src="js/player/camera.js"></script>

    <!-- Weaponry Systems -->
    <script src="js/weaponry/weaponry.js"></script>
    <script src="js/weaponry/weapons.js"></script>

    <!-- World -->
    <script src="js/world/world.js"></script>
    <script src="js/world/map.js"></script>

    <!-- Entities -->
    <script src="js/entities/entity.js"></script>
    <script src="js/entities/enemy.js"></script>

    <!-- Game Loop -->
    <script src="js/game.js"></script>
</body>
</html>
