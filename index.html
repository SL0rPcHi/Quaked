<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 60px;
            font-family: 'Courier New', monospace;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            pointer-events: none;
        }

        .hud-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .hud-value {
            font-size: 36px;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
        }

        #weaponDisplay {
            position: absolute;
            right: 40px;
            top: 40px;
            font-family: 'Courier New', monospace;
            color: #fff;
            pointer-events: none;
            text-align: right;
        }

        .weapon-item {
            font-size: 14px;
            margin-bottom: 6px;
            opacity: 0.6;
            letter-spacing: 0.5px;
        }

        .weapon-item.active {
            opacity: 1.0;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="hud-element" id="ammoLeft">
            <div class="hud-label">AMMO</div>
            <div class="hud-value" id="ammoValue">200</div>
        </div>
        <div class="hud-element" id="healthCenter">
            <div class="hud-label">HEALTH</div>
            <div class="hud-value" id="healthValue">100</div>
        </div>
        <div class="hud-element" id="armorRight">
            <div class="hud-label">ARMOR</div>
            <div class="hud-value" id="armorValue">0</div>
        </div>
    </div>

    <div id="weaponDisplay">
        <div class="weapon-item active" id="weapon0">MACHINEGUN</div>
        <div class="weapon-item" id="weapon1">SHOTGUN</div>
    </div>

    <!-- Three.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon-es for physics -->
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>

    <!-- Engine Core -->
    <script src="./js/core/engine.js"></script>
    <script src="./js/core/input.js"></script>
    <script src="./js/core/physics.js"></script>
    <script src="./js/core/renderer.js"></script>

    <!-- Player Systems -->
    <script src="./js/player/player.js"></script>
    <script src="./js/player/movement.js"></script>
    <script src="./js/player/slide_movement.js"></script>
    <script src="./js/player/camera.js"></script>

    <!-- Weaponry Systems -->
    <script src="./js/weaponry/weaponry.js"></script>
    <script src="./js/weaponry/weapons.js"></script>

    <!-- World -->
    <script src="./js/world/world.js"></script>
    <script src="./js/world/map.js"></script>

    <!-- Entities -->
    <script src="./js/entities/entity.js"></script>
    <script src="./js/entities/enemy.js"></script>

    <!-- Game Loop -->
    <script src="./js/game.js"></script>
</body>
</html>
